    <script>

                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        background: '#0a0a0a',

                        textSecondary: '#a1a1aa',

                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },

                            '0%': { opacity: '0', transform: 'translateY(16px) scale(0.98)' },

    <style>
        /* Base styles and custom scrollbar */

        }

            background-color: theme('colors.textPrimary');
            color: theme('colors.background');
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.border');
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.textSecondary');
        }

        /* Subtle background glow */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 500px;
            background: radial-gradient(circle at top, rgba(255,255,255,0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .img-fallback {
            background-image: radial-gradient(theme('colors.border') 1px, transparent 1px);
            background-size: 12px 12px;
            background-color: theme('colors.surface');
        }
        
        .hide-scroll {
            overflow: hidden;
        }
    </style>

            grid.innerHTML = projectData.map((project, index) => {

            lucide.createIcons();

            // Show Modal
            document.body.classList.add('hide-scroll');
            modalBackdrop.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            
            // Reset scroll position
            modalContent.querySelector('.overflow-y-auto').scrollTop = 0;
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                document.body.classList.remove('hide-scroll');
            }, 300); // Wait for transition
        }

        // Helper to ensure URLs are properly formatted
        function urlFix(url) {
            if (!url.startsWith('http') && !url.startsWith('/')) {
                return `https://${url}`;
            }
            return url;
        }

        // Event Listeners
        closeModalBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modalBackdrop.classList.contains('opacity-0')) {
                closeModal();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
        });

    </script>
</body>
</html>
