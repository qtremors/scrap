<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sea Luminescence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #000428, #004e92); /* Deep sea gradient */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas by default */
            display: flex;
            padding: 2rem;
            box-sizing: border-box;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .glass-panel {
            pointer-events: auto; /* Re-enable interactions for the panel */
            background: rgba(10, 20, 40, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00f2fe;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px #00f2fe;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="text-white">

    <!-- Canvas for the WebGL/2D Simulation -->
    <div id="canvas-container">
        <canvas id="luminescenceCanvas"></canvas>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="glass-panel rounded-2xl p-6 w-full max-w-sm transition-all duration-300 hover:bg-opacity-50">
            <h1 class="text-2xl font-bold mb-1 tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                Luminescence
            </h1>
            <p class="text-xs text-gray-400 mb-6 uppercase tracking-widest">Interactive Particle Ecosystem</p>
            
            <div class="space-y-5">
                <!-- Particle Count Control -->
                <div>
                    <div class="flex justify-between text-sm mb-2">
                        <label class="text-gray-300">Density</label>
                        <span id="countDisplay" class="text-cyan-400 font-mono">150</span>
                    </div>
                    <input type="range" id="particleCount" min="50" max="400" value="150" class="w-full">
                </div>

                <!-- Interaction Radius Control -->
                <div>
                    <div class="flex justify-between text-sm mb-2">
                        <label class="text-gray-300">Glow Radius</label>
                        <span id="radiusDisplay" class="text-cyan-400 font-mono">120</span>
                    </div>
                    <input type="range" id="interactionRadius" min="50" max="300" value="120" class="w-full">
                </div>

                <!-- Theme Selector -->
                <div>
                    <label class="text-sm text-gray-300 block mb-3">Color Palette</label>
                    <div class="flex gap-3">
                        <button class="theme-btn w-8 h-8 rounded-full border-2 border-white/20 focus:outline-none focus:border-white transition-all transform hover:scale-110" style="background: linear-gradient(135deg, #00f2fe, #4facfe)" data-theme="ocean"></button>
                        <button class="theme-btn w-8 h-8 rounded-full border-2 border-white/20 focus:outline-none focus:border-white transition-all transform hover:scale-110" style="background: linear-gradient(135deg, #fa709a, #fee140)" data-theme="sunset"></button>
                        <button class="theme-btn w-8 h-8 rounded-full border-2 border-white/20 focus:outline-none focus:border-white transition-all transform hover:scale-110" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb)" data-theme="biolume"></button>
                        <button class="theme-btn w-8 h-8 rounded-full border-2 border-white/20 focus:outline-none focus:border-white transition-all transform hover:scale-110" style="background: linear-gradient(135deg, #43e97b, #38f9d7)" data-theme="toxic"></button>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 pt-4 border-t border-white/10 text-xs text-gray-500 text-center">
                Move cursor or touch screen to interact
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('luminescenceCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const countSlider = document.getElementById('particleCount');
        const radiusSlider = document.getElementById('interactionRadius');
        const countDisplay = document.getElementById('countDisplay');
        const radiusDisplay = document.getElementById('radiusDisplay');
        const themeBtns = document.querySelectorAll('.theme-btn');

        let particlesArray = [];
        let numParticles = parseInt(countSlider.value);
        let interactionRadius = parseInt(radiusSlider.value);

        // Themes
        const palettes = {
            ocean: ['#00f2fe', '#4facfe', '#000428', '#ffffff'],
            sunset: ['#fa709a', '#fee140', '#ff0844', '#ffb199'],
            biolume: ['#a18cd1', '#fbc2eb', '#8fd3f4', '#84fab0'],
            toxic: ['#43e97b', '#38f9d7', '#f9d423', '#ff4e50']
        };
        let currentPalette = palettes.ocean;

        // Mouse/Touch Interaction Object
        const mouse = {
            x: null,
            y: null,
            radius: interactionRadius
        };

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init(); // Re-initialize particles to spread them out on resize
        }
        window.addEventListener('resize', resizeCanvas);

        // Event Listeners for Interaction
        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('touchmove', (event) => {
            mouse.x = event.touches[0].clientX;
            mouse.y = event.touches[0].clientY;
        });

        // Clear mouse position when it leaves the screen
        window.addEventListener('mouseout', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });
        window.addEventListener('touchend', () => {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // UI Event Listeners
        countSlider.addEventListener('input', (e) => {
            numParticles = parseInt(e.target.value);
            countDisplay.innerText = numParticles;
            init(); // Re-init with new count
        });

        radiusSlider.addEventListener('input', (e) => {
            interactionRadius = parseInt(e.target.value);
            mouse.radius = interactionRadius;
            radiusDisplay.innerText = interactionRadius;
        });

        themeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const themeName = e.target.getAttribute('data-theme');
                currentPalette = palettes[themeName];
                
                // Active state styling for buttons
                themeBtns.forEach(b => b.classList.remove('border-white', 'scale-110'));
                e.target.classList.add('border-white', 'scale-110');
                
                // Update colors of existing particles
                particlesArray.forEach(p => p.color = currentPalette[Math.floor(Math.random() * currentPalette.length)]);
            });
        });

        // Particle Class
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1; // 1 to 3 px
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1; // Weight/sluggishness
                this.color = currentPalette[Math.floor(Math.random() * currentPalette.length)];
                
                // Natural drifting movement
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                // Natural drift
                this.baseX += this.vx;
                this.baseY += this.vy;

                // Bounce off walls (wrap around for seamless feel)
                if(this.baseX > canvas.width + 50) this.baseX = -50;
                if(this.baseX < -50) this.baseX = canvas.width + 50;
                if(this.baseY > canvas.height + 50) this.baseY = -50;
                if(this.baseY < -50) this.baseY = canvas.height + 50;

                // Interaction physics
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                
                // Max distance, beyond that the force is 0
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    // Repel effect
                    this.x -= directionX;
                    this.y -= directionY;
                    
                    // Increase size slightly when interacting
                    if(this.size < 4) this.size += 0.2;
                } else {
                    // Return to original (drifting) position
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                    
                    // Return to normal size
                    if(this.size > 2) this.size -= 0.1;
                }

                this.draw();
            }
        }

        // Initialize Particles
        function init() {
            particlesArray = [];
            for (let i = 0; i < numParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        // Animation Loop
        function animate() {
            // Clear screen with a slight trailing effect
            ctx.fillStyle = 'rgba(0, 4, 40, 0.2)'; // Fades the previous frame
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Set blending mode for glowing effect
            ctx.globalCompositeOperation = 'lighter';

            for (let i = 0; i < particlesArray.length; i++) {
                // Set color for this particle
                ctx.fillStyle = particlesArray[i].color;
                particlesArray[i].update();
                
                // Connect particles
                connect(i);
            }
            
            // Reset composite operation so background fills correctly on next frame
            ctx.globalCompositeOperation = 'source-over';
            
            requestAnimationFrame(animate);
        }

        // Draw lines between close particles
        function connect(index) {
            for (let j = index; j < particlesArray.length; j++) {
                let dx = particlesArray[index].x - particlesArray[j].x;
                let dy = particlesArray[index].y - particlesArray[j].y;
                let distance = (dx * dx + dy * dy);

                // If particles are close enough, draw a line
                if (distance < (canvas.width / 10) * (canvas.height / 10)) {
                    // Opacity based on distance
                    let opacityValue = 1 - (distance / 20000);
                    
                    // Only draw if opacity is meaningful
                    if(opacityValue > 0) {
                        ctx.strokeStyle = particlesArray[index].color.replace(')', `, ${opacityValue})`).replace('rgb', 'rgba');
                        
                        // Fallback if color is hex
                        if(particlesArray[index].color.startsWith('#')) {
                            ctx.strokeStyle = hexToRgba(particlesArray[index].color, opacityValue);
                        }

                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[index].x, particlesArray[index].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Utility to convert hex to rgba for the connecting lines
        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Set initial active state for theme button
        document.querySelector('[data-theme="ocean"]').classList.add('border-white', 'scale-110');

        // Start
        resizeCanvas(); // This also calls init()
        animate();
    </script>
</body>
</html>
