    <title>App Directory | Selected Works</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        background: '#050505',
                        surface: '#121212',
                        border: '#262626',
                        textPrimary: '#ffffff',
                        textSecondary: '#a1a1aa',
                    }
                }
            }
        }

    <style>
        /* Subtle noise texture for a premium matte finish */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Image fallback pattern (Used if actual assets are missing) */
        .img-fallback {
            background-image: radial-gradient(#262626 1px, transparent 1px);
            background-size: 8px 8px;
            background-color: #121212;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Pure CSS Animation to avoid CDN config issues */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4 sm:px-6 relative bg-background text-textPrimary selection:bg-white selection:text-black antialiased">
    <div class="noise-overlay"></div>

                <i data-lucide="command" class="w-8 h-8 text-textSecondary"></i>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-textPrimary mb-2">Systems & Applications</h1>
            <p class="text-sm text-textSecondary">A central directory of live deployments and repositories.</p>
        </header>

        <!-- Links Container -->
        <div id="links-container" class="flex flex-col gap-3">
            <!-- Links will be injected here -->
        </div>

        <footer class="mt-16 text-center text-xs text-textSecondary/50 pb-8 animate-fade-in" style="animation-delay: 800ms;">
            Directory updated automatically.
        </footer>
    </main>

        const container = document.getElementById('links-container');

        // Status styling map
        const statusStyles = {
            'beta': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'wip': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
            'archive': 'bg-zinc-500/10 text-zinc-400 border-zinc-500/20',
        };

        function urlFix(url) {
            if (!url.startsWith('http') && !url.startsWith('/')) return `https://${url}`;
            return url;
        }

        function renderDirectory() {
            container.innerHTML = projectData.map((project, index) => {
                
                // Identify the main action link (prefer primary, fallback to secondary)
                const primaryLink = project.links.find(l => l.class === 'link-primary');
                const secondaryLink = project.links.find(l => l.class === 'link-secondary' || l.text.toLowerCase().includes('github'));
                
                // Determine the main URL for the entire card to be clickable
                const mainUrl = primaryLink ? primaryLink.url : (secondaryLink ? secondaryLink.url : '#');
                
                const statusHtml = project.status ? 
                    `<span class="ml-2 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider rounded border ${statusStyles[project.status]}">${project.status}</span>` : '';

                return `
                    <div class="animate-fade-in group relative flex items-center p-3 sm:p-4 rounded-2xl bg-surface border border-border hover:border-textSecondary/40 transition-all duration-300 hover:shadow-[0_4px_20px_rgba(0,0,0,0.5)]" style="animation-delay: ${index * 40}ms;">
                        
                        <!-- Thumbnail -->
                        <a href="${urlFix(mainUrl)}" target="_blank" rel="noopener noreferrer" class="shrink-0 w-12 h-12 sm:w-14 sm:h-14 rounded-xl overflow-hidden bg-border relative block">
                            <img src="${project.image}" alt="${project.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.onerror=null; this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');">
                            <div class="hidden img-fallback w-full h-full flex items-center justify-center transition-transform duration-500 group-hover:scale-110">
                                <i data-lucide="layers" class="w-5 h-5 text-textSecondary opacity-50"></i>
                            </div>
                        </a>

                        <!-- Text Content -->
                        <div class="ml-4 flex-grow min-w-0 pr-4">
                            <a href="${urlFix(mainUrl)}" target="_blank" rel="noopener noreferrer" class="block focus:outline-none">
                                <h2 class="text-sm sm:text-base font-medium text-textPrimary truncate flex items-center">
                                    ${project.title} ${statusHtml}
                                </h2>
                                <p class="text-xs sm:text-sm text-textSecondary truncate mt-0.5 sm:mt-1">${project.description}</p>
                            </a>
                        </div>

                        <!-- Action Links -->
                        <div class="shrink-0 flex items-center gap-2 relative z-10">
                            ${primaryLink ? `
                                <a href="${urlFix(primaryLink.url)}" target="_blank" rel="noopener noreferrer" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-background bg-textPrimary rounded-lg hover:bg-white transition-colors">
                                    ${primaryLink.text}
                                </a>
                                <a href="${urlFix(primaryLink.url)}" target="_blank" rel="noopener noreferrer" class="flex sm:hidden items-center justify-center w-8 h-8 rounded-lg bg-textPrimary text-background hover:bg-white transition-colors">
                                    <i data-lucide="external-link" class="w-4 h-4"></i>
                                </a>
                            ` : ''}
                            
                            ${secondaryLink ? `
                                <a href="${urlFix(secondaryLink.url)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center w-8 h-8 rounded-lg border border-border text-textSecondary hover:text-textPrimary hover:bg-border/50 transition-colors" title="${secondaryLink.text}">
                                    <i data-lucide="${secondaryLink.text.toLowerCase().includes('github') ? 'github' : 'folder-git-2'}" class="w-4 h-4"></i>
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', renderDirectory);
